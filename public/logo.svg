      <line x1="18" y1="32" x2="32" y2="32" />
      <line x1="32" y1="32" x2="46" y2="32" />
      <line x1="18" y1="46" x2="32" y2="46" />
      <line x1="32" y1="46" x2="46" y2="46" />
      <line x1="18" y1="18" x2="18" y2="32" />
      <line x1="18" y1="32" x2="18" y2="46" />
      <line x1="32" y1="18" x2="32" y2="32" />
      <line x1="32" y1="32" x2="32" y2="46" />
      <line x1="46" y1="18" x2="46" y2="32" />
